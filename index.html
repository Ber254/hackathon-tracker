/* ─── TOKENS ───────────────────────────────────────────────────────────── */
/* Layout: header + active grid + archived section */
:root {
  --bg:        #0C0C14;
  --surface:   #13131F;

  --border:    #252540;
  --fg:        #E0E0F0;
  --muted:     #6060A0;
  --accent:    #7C5CFC;
  --accent-lo: rgba(124,92,252,.12);

  --s-planning:   #3B82F6;
  --s-building:   #F59E0B;
  --s-submitted:  #A855F7;
  --s-won:        #22C55E;
  --s-lost:       #64748B;

  --font-display: 'Syne', system-ui, sans-serif;
  --font-mono:    'JetBrains Mono', 'Fira Mono', monospace;

  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #EDEDF8;
    --surface:   #FFFFFF;
    --surface2:  #E4E4F2;
    --border:    #D0D0E8;
    --fg:        #10101C;
    --muted:     #6868A8;
    --accent:    #5B3EE0;
    --accent-lo: rgba(91,62,224,.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:        #EDEDF8;
  --surface:   #FFFFFF;
  --surface2:  #E4E4F2;
  --border:    #D0D0E8;
  --fg:        #10101C;
  --muted:     #6868A8;
  --accent:    #5B3EE0;
  --accent-lo: rgba(91,62,224,.10);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; margin: 0 }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.6;
  padding-left:  max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px;
  min-height: 100%;
}

/* ─── HEADER ───────────────────────────────────────────────────────────── */
.site-header {
  max-width: 900px;
  margin: 0 auto 40px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
.wordmark h1 {

  font-weight: 800;
  font-size: clamp(1.7rem, 5vw, 2.5rem);
  letter-spacing: -.04em;
  line-height: 1;
}
.wordmark h1 span { color: var(--accent); }
.wordmark p {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .08em;
  text-transform: uppercase;
  margin-top: 5px;
}
.header-right {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.stat-pill {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 11px;
  color: var(--muted);
  display: flex;
  align-items: baseline;
  gap: 5px;
}
.stat-pill strong {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 700;
  color: var(--fg);
}
.stat-pill.prize-total strong { color: #22C55E; }
.icon-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 11px;
  color: var(--muted);
  cursor: pointer;
  font-size: 14px;
  line-height: 1;
  transition: border-color .15s, color .15s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ─── SECTION LABEL ────────────────────────────────────────────────────── */
.section-label {
  max-width: 900px;
  margin: 0 auto 12px;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .12em;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

/* ─── GRID ─────────────────────────────────────────────────────────────── */
.grid {
  max-width: 900px;
  margin: 0 auto 32px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(400px, 100%), 1fr));
  gap: 14px;
}

/* ─── CARD ─────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 22px 18px;
  display: flex;
  flex-direction: column;
  gap: 13px;
  transition: border-color .2s, opacity .2s;
  position: relative;
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  inset: 0 0 auto;
  height: 3px;
  background: var(--c-accent);
  border-radius: 14px 14px 0 0;
}
.card:hover { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
.card.archived { opacity: .5; }
.card.archived:hover { opacity: .85; }

/* card top row */
.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.card-badge {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 100px;
  color: var(--c-accent);
  border: 1px solid color-mix(in srgb, var(--c-accent) 50%, transparent);
  background: color-mix(in srgb, var(--c-accent) 10%, transparent);
  font-family: var(--font-mono);
  white-space: nowrap;
}
.card-actions { display: flex; gap: 5px; }
.card-action-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 3px 7px;
  font-size: 11px;
  color: var(--muted);
  cursor: pointer;
  transition: border-color .15s, color .15s;
  font-family: var(--font-mono);
}
.card-action-btn:hover { border-color: var(--accent); color: var(--accent); }
.card-action-btn.danger:hover { border-color: var(--s-lost); color: var(--s-lost); }

/* title */
.card-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1rem;
  color: var(--fg);
  line-height: 1.3;
  text-wrap: balance;
}
.card-project {
  font-size: 10px;
  color: var(--accent);
  letter-spacing: .07em;
  text-transform: uppercase;
  margin-bottom: 3px;
}

/* ─── STAGES ───────────────────────────────────────────────────────────── */
.stages {
  display: flex;
  flex-direction: column;
  gap: 0;
  position: relative;
}
.stages::before {
  content: '';
  position: absolute;
  left: 7px;
  top: 14px;
  bottom: 14px;
  width: 1px;
  background: var(--border);
}
.stage {
  display: grid;
  grid-template-columns: 15px 1fr;
  gap: 0 10px;
  align-items: start;
  padding: 5px 0;
}
.stage-dot {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface);
  margin-top: 3px;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
  transition: border-color .2s, background .2s;
}
.stage.active .stage-dot {
  border-color: var(--c-stage);
  background: var(--c-stage);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--c-stage) 20%, transparent);
}
.stage.done .stage-dot {
  border-color: var(--s-won);
  background: var(--s-won);
}
.stage.future .stage-dot { opacity: .4; }
.stage-body { min-width: 0; }
.stage-name {
  font-size: 11px;
  font-weight: 500;
  color: var(--fg);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.stage.future .stage-name { color: var(--muted); }
.stage-status-tag {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 1px 6px;
  border-radius: 4px;
  font-family: var(--font-mono);
  color: var(--c-stage);
  background: color-mix(in srgb, var(--c-stage) 12%, transparent);
}
.stage-date {
  font-size: 10.5px;
  color: var(--muted);
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}
.stage-date .cd {
  color: var(--c-stage);

}
.stage-note {
  font-size: 11px;
  color: var(--muted);
  margin-top: 2px;

/* ─── DIVIDER ──────────────────────────────────────────────────────────── */
.divider { height: 1px; background: var(--border); }

/* ─── PRIZE ROW ─────────────────────────────────────────────────────────── */
.prize-row {

}
.prize-block { display: flex; flex-direction: column; gap: 1px; }
.prize-label {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: .09em;
  color: var(--muted);
}
.prize-amount {

  align-self: center;

/* ─── PARTNERS ──────────────────────────────────────────────────────────── */
.partners-row {

  gap: 6px;
  flex-wrap: wrap;

}
.partner-chip {
  display: flex;
  align-items: center;

  text-transform: uppercase;

}

/* ─── PENDING CHIPS ─────────────────────────────────────────────────────── */

/* ─── CARD FOOTER ───────────────────────────────────────────────────────── */

/* ─── ARCHIVED SECTION ──────────────────────────────────────────────────── */

/* ─── FOOTER ────────────────────────────────────────────────────────────── */
.site-footer {

  padding-top: 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.site-footer p, .site-footer span { font-size: 11px; color: var(--muted); }
</style>

/* ═══════════════════════════════════════════════════════════════════════════

/* ── STATUS CONFIG ─────────────────────────────────────────────────────── */
const STATUS = {
  planning:  { label: "Pendiente",  color: "var(--s-planning)"  },
  building:  { label: "En progreso",color: "var(--s-building)"  },
  submitted: { label: "Enviado",    color: "var(--s-submitted)" },
  won:       { label: "Ganado",     color: "var(--s-won)"       },
  lost:      { label: "Eliminado",  color: "var(--s-lost)"      },
};

/* ── HELPERS ───────────────────────────────────────────────────────────── */
function fmt(iso) {
  if (!iso) return null;
  return new Date(iso + 'T12:00:00').toLocaleDateString('es-AR',
    { day: '2-digit', month: 'short', year: 'numeric' });
}

function countdown(iso) {
  if (!iso) return null;
  const diff = new Date(iso + 'T23:59:00-03:00').getTime() - Date.now();
  if (diff < 0) return 'vencido';
  const d = Math.floor(diff / 86400000);
  if (d === 0) return 'hoy';
  if (d === 1) return 'mañana';
  return `${d}d`;
}

function fmtPrize(n) {
  return '$' + n.toLocaleString('en-US');
}

function currentStageStatus(stages) {
  // first non-won stage, or last stage
  const active = stages.find(s => s.status !== 'won' && s.status !== 'lost');
  return active ?? stages[stages.length - 1];
}

function cardAccent(stages) {
  const cur = currentStageStatus(stages);
  return STATUS[cur.status]?.color ?? 'var(--s-planning)';
}

function extIcon() {
  return `<svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 2H2a1 1 0 00-1 1v7a1 1 0 001 1h7a1 1 0 001-1V7M7 1h4m0 0v4M11 1L5.5 6.5"/>
  </svg>`;
}

/* ── BUILD CARD HTML ───────────────────────────────────────────────────── */
function buildCard(h, idx) {
  const cur = currentStageStatus(h.stages);
  const curStatus = STATUS[cur.status] ?? STATUS.planning;
  const accent = cardAccent(h.stages);
  const myNet = h.totalPrize != null ? Math.round(h.totalPrize * h.mySharePct / 100) : null;

  // stages stepper
  const stagesHtml = h.stages.map((s, si) => {
    const allPrev = h.stages.slice(0, si).every(x => x.status === 'won');
    const isActive = allPrev && s.status !== 'won' && s.status !== 'lost';
    const isDone   = s.status === 'won';
    const cls      = isActive ? 'active' : isDone ? 'done' : 'future';
    const st       = STATUS[s.status] ?? STATUS.planning;
    const cVar     = `--c-stage: ${st.color}`;
    const cd       = s.date ? countdown(s.date) : null;
    const dl       = fmt(s.date);
    return `
      <div class="stage ${cls}" style="${cVar}">
        <div class="stage-dot"></div>
        <div class="stage-body">
          <div class="stage-name">
            ${s.name}
            ${isActive || isDone ? `<span class="stage-status-tag">${st.label}</span>` : ''}
          </div>
          ${dl ? `<div class="stage-date">${dl}${cd && isActive ? `<span class="cd">(${cd})</span>` : ''}</div>` : ''}
          ${s.notes ? `<div class="stage-note">${s.notes}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  // prize section
  let prizeHtml = '';
  if (h.totalPrize != null) {
    if (h.mySharePct < 100) {
      prizeHtml = `
        <div class="divider"></div>
        <div class="prize-row">
          <div class="prize-block">
            <span class="prize-label">Premio total</span>
            <span class="prize-amount">${fmtPrize(h.totalPrize)}</span>
          </div>
          <span class="prize-arrow">→</span>
          <div class="prize-block">
            <span class="prize-label">Mi parte (${h.mySharePct}%)</span>
            <span class="prize-amount mine">${fmtPrize(myNet)}</span>
          </div>
        </div>`;
    } else {
      prizeHtml = `
        <div class="divider"></div>
        <div class="prize-row">
          <div class="prize-block">
            <span class="prize-label">Premio</span>
            <span class="prize-amount mine">${fmtPrize(h.totalPrize)}</span>
          </div>
        </div>`;
    }
  }

  // partners
  let partnersHtml = '';
  if (h.partners && h.partners.length) {
    partnersHtml = `
      <div class="divider"></div>
      <div class="partners-row">
        <span class="partners-label">Socios</span>
        ${h.partners.map(p => `
          <span class="partner-chip">
            ${p.name} <span class="share">${p.sharePct}%</span>
          </span>`).join('')}
      </div>`;
  }

  // pending
  let pendingHtml = '';
  if (h.pending && h.pending.length) {
    pendingHtml = `
      <div class="divider"></div>
      <div class="pending-list">
        ${h.pending.map(p => `<span class="pending-chip">${p}</span>`).join('')}
      </div>`;
  }

  // close/reopen button label
  const closeBtn = h.closed
    ? `<button class="card-action-btn" onclick="toggleClosed(${idx})">↩ Reabrir</button>`
    : `<button class="card-action-btn danger" onclick="toggleClosed(${idx})">Cerrar</button>`;

  return `
    <div class="card${h.closed ? ' archived' : ''}" style="--c-accent: ${accent}">
      <div class="card-top">
        <span class="card-badge" style="--c-accent:${accent}">${curStatus.label}</span>
        <div class="card-actions">${closeBtn}</div>
      </div>
      <div>
        ${h.project ? `<div class="card-project">${h.project}</div>` : ''}
        <div class="card-title">${h.name}</div>
      </div>
      <div class="stages">${stagesHtml}</div>
      ${prizeHtml}
      ${partnersHtml}
      ${pendingHtml}
      <div class="divider"></div>
      <div class="card-footer">
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${h.link ? `<a class="ext-link" href="${h.link}" target="_blank" rel="noopener">${extIcon()} ${h.linkLabel ?? 'Ver'}</a>` : ''}
          ${h.profileLink ? `<a class="ext-link profile" href="${h.profileLink}" target="_blank" rel="noopener">${extIcon()} ${h.profileLabel ?? 'Mi perfil'}</a>` : ''}
        </div>
      </div>
    </div>`;
}

/* ── RENDER ────────────────────────────────────────────────────────────── */
let archivedVisible = false;

function render() {
  const active   = HACKATHONS.filter(h => !h.closed);
  const archived = HACKATHONS.filter(h => h.closed);

  document.getElementById('grid-active').innerHTML =
    active.map((h, i) => buildCard(h, HACKATHONS.indexOf(h))).join('');

  const archivedGrid   = document.getElementById('grid-archived');
  const archivedToggle = document.getElementById('archived-toggle');
  if (archived.length) {
    archivedGrid.innerHTML = archived.map(h => buildCard(h, HACKATHONS.indexOf(h))).join('');
    archivedToggle.hidden = false;
    document.getElementById('archived-label').textContent =
      `Cerrados (${archived.length})`;
  } else {
    archivedToggle.hidden = true;
    archivedGrid.style.display = 'none';
  }

  // stats
  document.getElementById('count-active').textContent = active.length;
  const myTotal = HACKATHONS
    .filter(h => !h.closed && h.totalPrize != null)
    .reduce((s, h) => s + Math.round(h.totalPrize * h.mySharePct / 100), 0);
  document.getElementById('total-prize').textContent =
    myTotal > 0 ? fmtPrize(myTotal) + ' posible' : '—';

  document.getElementById('last-updated').textContent =
    'Act. ' + new Date().toLocaleDateString('es-AR',
      { day: '2-digit', month: 'short', year: 'numeric' });
}

/* ── TOGGLE CLOSED (in-memory, resets on reload — editá closed: en el array para persistir) */
function toggleClosed(idx) {
  HACKATHONS[idx].closed = !HACKATHONS[idx].closed;
  render();
}

function toggleArchived() {
  archivedVisible = !archivedVisible;
  document.getElementById('grid-archived').style.display = archivedVisible ? 'grid' : 'none';
  document.getElementById('archived-arrow').textContent = archivedVisible ? '▾' : '▸';
}

/* ── THEME ─────────────────────────────────────────────────────────────── */
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('theme', next); } catch(e) {}
}
try {
  const t = localStorage.getItem('theme');
  if (t) document.documentElement.setAttribute('data-theme', t);
} catch(e) {}

render();
</script>
